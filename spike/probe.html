<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fallow Spike</title>
  <style>
    /* Throwaway spike styling: legibility only. Deleted with the rest of spike/ in Task 2. */
    :root {
      color-scheme: light dark;
      --bg: #fbfbfa; --fg: #1a1a18; --panel: #fff; --line: #d8d6d0;
      --btn: #fff; --btn-fg: #1a1a18; --accent: #4a6b3f; --out-bg: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16171a; --fg: #e8e6e1; --panel: #1e2024; --line: #35383e;
        --btn: #23262b; --btn-fg: #e8e6e1; --accent: #8fb87c; --out-bg: #14161a;
      }
    }
    * { box-sizing: border-box; }
    body {
      font: 14px/1.5 system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--fg);
      margin: 0; padding: 24px; max-width: 1100px;
    }
    h3 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
    .sub { margin: 0 0 20px; opacity: 0.7; font-size: 13px; }
    #buttons {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 16px; margin-bottom: 16px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    }
    button {
      font: inherit; font-size: 13px; padding: 7px 12px;
      background: var(--btn); color: var(--btn-fg);
      border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
    }
    button:hover:not(:disabled) { border-color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: 0.4; cursor: default; }
    pre {
      font: 12.5px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: var(--out-bg); color: var(--fg);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 16px; margin: 0; min-height: 320px;
      white-space: pre-wrap; overflow-wrap: anywhere;
      -webkit-user-select: all; user-select: all;
    }
  </style>
</head>
<body>
  <h3>Fallow Spike — milestone 0</h3>
  <p class="sub">Throwaway diagnostic. Click into the output and press ⌘A then ⌘C to copy it all.</p>
  <div id="buttons"></div>
  <pre id="out"></pre>
  <script src="probe.js"></script>
</body>
</html>
